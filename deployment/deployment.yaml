apiVersion: apps/v1
kind: Deployment
metadata:
  name: qmd
  namespace: cicadia-system
  labels:
    app.kubernetes.io/name: qmd
    app.kubernetes.io/part-of: cicadia-stack
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: qmd
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qmd
        app.kubernetes.io/part-of: cicadia-stack
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: qmd
          image: daviddwyer1987/qmd-cicadia:1.0.9
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8181
              protocol: TCP
          env:
            - name: QMD_LLM_BACKEND
              value: ollama
            - name: QMD_OLLAMA_BASE_URL
              value: http://ollama.cicadia-system.svc.cluster.local:11434
            - name: QMD_MCP_PORT
              value: "8181"
            - name: QMD_MCP_HOST
              value: 0.0.0.0
            - name: XDG_CACHE_HOME
              value: /tmp/cache
            - name: QMD_OLLAMA_EMBED_MODEL
              value: nomic-embed-text
            - name: QMD_OLLAMA_GENERATE_MODEL
              value: qwen3:1.7b
            - name: QMD_OLLAMA_RERANK_MODEL
              value: qwen3:0.6b
            - name: QMD_CONFIG_DIR
              value: /qmd-data
            - name: INDEX_PATH
              value: /qmd-data/index.sqlite
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /qmd-data /tmp /tmp/cache /config
              exec node dist/cli/qmd.js mcp --http --port 8181
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: qmd-config
              mountPath: /config
              readOnly: true
            - name: qmd-smb
              mountPath: /data
            - name: qmd-data
              mountPath: /qmd-data
          livenessProbe:
            tcpSocket:
              port: 8181
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 6
            timeoutSeconds: 2
          readinessProbe:
            tcpSocket:
              port: 8181
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 2
      terminationGracePeriodSeconds: 30
      volumes:
        - name: qmd-smb
          persistentVolumeClaim:
            claimName: qmd-smb-root
        - name: qmd-data
          persistentVolumeClaim:
            claimName: qmd-data
        - name: qmd-config
          configMap:
            name: qmd-config
            defaultMode: 420
      restartPolicy: Always